name: ScholarPro CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: scholarpro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend test and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend lint
        working-directory: backend
        run: npx eslint .

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand --passWithNoTests

  frontend-quality:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build and publish container images
    needs:
      - backend-tests
      - frontend-quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: ./backend
            target: runtime
          - app: backend-migrator
            context: ./backend
            target: migrator
          - app: frontend
            context: ./frontend
            target: runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker image tags must be lowercase and cannot contain path separators.
      # GitHub branch names such as "feature/student-registration" would make
      # a tag invalid, so sanitize both the owner and the branch-derived tag.
      - name: Compute lowercase image owner
        id: image_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute valid docker tag
        id: image_tag
        run: echo "tag=$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')" >> "$GITHUB_OUTPUT"

      - name: Validate frontend production configuration
        if: matrix.app == 'frontend'
        id: frontend_config
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_JWT_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_JWT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$NEXT_PUBLIC_BACKEND_URL" || -z "$NEXT_PUBLIC_JWT_PUBLIC_KEY" ]]; then
            echo "NEXT_PUBLIC_BACKEND_URL and NEXT_PUBLIC_JWT_PUBLIC_KEY must be set in this GitHub environment."
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_BACKEND_URL" != https://*/api/v1 || "$NEXT_PUBLIC_BACKEND_URL" == */ ]]; then
            echo "NEXT_PUBLIC_BACKEND_URL must be an HTTPS API base URL ending in /api/v1 with no trailing slash."
            exit 1
          fi
          if [[ "$NEXT_PUBLIC_JWT_PUBLIC_KEY" != *"BEGIN PUBLIC KEY"* || "$NEXT_PUBLIC_JWT_PUBLIC_KEY" != *"END PUBLIC KEY"* ]]; then
            echo "NEXT_PUBLIC_JWT_PUBLIC_KEY must contain a PEM public key."
            exit 1
          fi
          public_key="${NEXT_PUBLIC_JWT_PUBLIC_KEY//$'\r'/}"
          public_key="${public_key//$'\n'/\\n}"
          printf 'backend_url=%s\n' "$NEXT_PUBLIC_BACKEND_URL" >> "$GITHUB_OUTPUT"
          printf 'jwt_public_key=%s\n' "$public_key" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          target: ${{ matrix.target }}
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ steps.frontend_config.outputs.backend_url }}
            NEXT_PUBLIC_JWT_PUBLIC_KEY=${{ steps.frontend_config.outputs.jwt_public_key }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ghcr.io/${{ steps.image_owner.outputs.owner }}/scholarpro-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ steps.image_owner.outputs.owner }}/scholarpro-${{ matrix.app }}:${{ steps.image_tag.outputs.tag }}

  deploy:
    name: Deploy to environment
    needs:
      - docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_SSH_PRIVATE_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_PRIVATE_KEY, and DEPLOY_KNOWN_HOSTS must be configured in this GitHub environment."
            exit 1
          fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

          chmod +x scripts/deploy.sh

          scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" scripts/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/deploy-${APP_ENV}.sh"
          scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_PORT" infrastructure/caddy/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:/tmp/Caddyfile.${APP_ENV}"

          printf '%s' "$GITHUB_TOKEN" | ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ENV='${APP_ENV}' IMAGE_TAG='${IMAGE_TAG}' GHCR_OWNER='${GHCR_OWNER}' GITHUB_ACTOR='${GITHUB_ACTOR}' bash /tmp/deploy-${APP_ENV}.sh"